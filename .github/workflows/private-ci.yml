name: Private validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: sh -n deploy/nas-install.sh
      - run: node --import tsx tools/scripts/setupEnvFiles.ts && pnpm exec vite build
      - run: docker build --build-arg PRIVATE_COMMIT=${{ github.sha }} -t suwayomi-private:ci .
