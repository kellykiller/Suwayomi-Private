name: Private validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==12.3.0 numpy==2.2.6
      - run: python -m unittest discover -s private/translation -p 'test_*.py'
      - run: sh -n deploy/nas-install.sh
      - run: node --import tsx tools/scripts/setupEnvFiles.ts && pnpm exec vite build
      - run: docker build --build-arg PRIVATE_COMMIT=${{ github.sha }} -t suwayomi-private:ci .
      - name: Verify bundled translator offline without network or credentials
        run: docker run --rm --network none --read-only --cap-drop=ALL --security-opt=no-new-privileges:true --user=10001:10001 --memory=1g --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 -e PYTHONHOME=/opt/translator-runtime -e LD_LIBRARY_PATH=/opt/translator-runtime/lib -e PYTHONDONTWRITEBYTECODE=1 -e HOME=/tmp -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 --entrypoint /opt/translator-runtime/bin/python3.12 suwayomi-private:ci /opt/translator/server/selftest.py
      - name: Run bundled translator regressions in the actual runtime
        run: docker run --rm --network none --read-only --cap-drop=ALL --security-opt=no-new-privileges:true --user=10001:10001 --memory=3g --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 -e PYTHONHOME=/opt/translator-runtime -e LD_LIBRARY_PATH=/opt/translator-runtime/lib -e PYTHONDONTWRITEBYTECODE=1 -e HOME=/tmp -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 --entrypoint /opt/translator-runtime/bin/python3.12 suwayomi-private:ci -m unittest discover -s /app/private/cloud-translator/tests -v
      - name: Verify library export in a read-only container with the writable NAS mount
        run: docker run --rm --network none --read-only --cap-drop=ALL --security-opt=no-new-privileges:true --memory=256m --tmpfs /update:rw,noexec,nosuid,size=32m -e TMPDIR=/update -e PYTHONDONTWRITEBYTECODE=1 --entrypoint node suwayomi-private:ci --test private/tests/library-export.test.mjs
      - run: |
          ocr_ci_cpus=$(getconf _NPROCESSORS_ONLN)
          if [ "$ocr_ci_cpus" -gt 4 ]; then ocr_ci_cpus=4; fi
          docker run --rm --network none --read-only --cap-drop=ALL --security-opt=no-new-privileges:true --memory=3g --cpus="$ocr_ci_cpus" --pids-limit=128 --tmpfs /tmp:rw,noexec,nosuid,size=256m -e HF_HOME=/tmp/hf -e PYTHONDONTWRITEBYTECODE=1 -e OMP_NUM_THREADS="$ocr_ci_cpus" -e MKL_NUM_THREADS="$ocr_ci_cpus" -e OPENBLAS_NUM_THREADS="$ocr_ci_cpus" -e OCR_THREADS="$ocr_ci_cpus" --entrypoint /opt/ocr/bin/python suwayomi-private:ci /app/private/translation/smoke.py


