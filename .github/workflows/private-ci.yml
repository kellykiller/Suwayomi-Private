name: Private validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==12.3.0 numpy==2.2.6
      - run: python -m unittest discover -s private/translation -p 'test_*.py'
      - run: sh -n deploy/nas-install.sh
      - run: node --import tsx tools/scripts/setupEnvFiles.ts && pnpm exec vite build
      - run: docker build --build-arg PRIVATE_COMMIT=${{ github.sha }} -t suwayomi-private:ci .
      - run: docker run --rm --network none --read-only --cap-drop=ALL --security-opt=no-new-privileges:true --memory=3g --cpus=2 --pids-limit=128 --tmpfs /tmp:rw,noexec,nosuid,size=256m -e HF_HOME=/tmp/hf -e PYTHONDONTWRITEBYTECODE=1 -e OMP_NUM_THREADS=2 -e MKL_NUM_THREADS=2 --entrypoint /opt/ocr/bin/python suwayomi-private:ci /app/private/translation/smoke.py
